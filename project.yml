name: Pling
options:
  bundleIdPrefix: com.weidhaus
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  PlingCore:
    path: PlingCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 5SB3S8ESR3
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Pling:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: PlingCore
        product: PlingCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weidhaus.pling
        ASSETCATALOG_COMPILER_APPICON_NAME: Pling
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pling
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Justus-Constantin Weidhaus. MIT License."
        NSRemindersFullAccessUsageDescription: "Pling adds messages you choose to Reminders."
        SUFeedURL: https://github.com/weidhaus/pling/releases/latest/download/appcast.xml
        SUPublicEDKey: zg5CjuTwmnJiQIte5UWcT1L38VXVJ32a+jGCC+znKOc= # gitleaks:allow (public key, ships in the app)
        SUEnableAutomaticChecks: true
    entitlements:
      path: App/Pling.entitlements
      properties:
        com.apple.security.network.client: true
    postBuildScripts:
      - name: Bundle urgent sound
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/Sounds"
          cp /System/Library/Sounds/Sosumi.aiff "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/Sounds/PlingUrgent.aiff"
        basedOnDependencyAnalysis: false
